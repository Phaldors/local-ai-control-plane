[project]
name = "controlplane"
version = "0.1.0"
description = "Local AI Control Plane: traced runtimes and golden evals for local LLMs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
# Only needed to regenerate golden/extraction.jsonl from the cached CORD dataset.
build = [
    "datasets>=4.0.0",
]
# Serves MLX models via `mlx_lm.server`. The runtime client itself needs no mlx import.
mlx = [
    "mlx-lm>=0.28.0",
]
mcp = [
    "mcp>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The HTML/CSS template is one long literal by nature.
"controlplane/dashboard.py" = ["E501"]
